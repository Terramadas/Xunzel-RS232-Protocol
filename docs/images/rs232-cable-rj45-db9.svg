<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="1000" height="520" fill="#ffffff"/>
  <text x="500" y="42" text-anchor="middle" font-size="26" font-weight="bold" fill="#1a1a1a">RS-232 cable: inverter RJ45 to DB9</text>
  <text x="500" y="70" text-anchor="middle" font-size="16" fill="#555">Three wires, straight through. No crossover needed.</text>

  <!-- left box -->
  <rect x="50" y="100" width="260" height="270" rx="14" fill="#f2f4f7" stroke="#333" stroke-width="2"/>
  <text x="180" y="132" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Inverter</text>
  <text x="180" y="154" text-anchor="middle" font-size="15" fill="#333">RJ45 jack, RS-232 port</text>

  <!-- right box -->
  <rect x="690" y="100" width="260" height="270" rx="14" fill="#f2f4f7" stroke="#333" stroke-width="2"/>
  <text x="820" y="132" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Computer side</text>
  <text x="820" y="154" text-anchor="middle" font-size="15" fill="#333">DB9 plug (USB-RS232 adapter)</text>

  <!-- wires -->
  <g stroke-linecap="round">
    <!-- pin 1 white/orange -->
    <line x1="310" y1="215" x2="690" y2="215" stroke="#f08a1c" stroke-width="12"/>
    <line x1="310" y1="215" x2="690" y2="215" stroke="#ffffff" stroke-width="4" stroke-dasharray="14 14"/>
    <!-- pin 2 blue -->
    <line x1="310" y1="270" x2="690" y2="270" stroke="#1f5fd1" stroke-width="12"/>
    <!-- pin 8 white/green -->
    <line x1="310" y1="325" x2="690" y2="325" stroke="#2e9e4f" stroke-width="12"/>
    <line x1="310" y1="325" x2="690" y2="325" stroke="#ffffff" stroke-width="4" stroke-dasharray="14 14"/>
  </g>

  <!-- left terminals -->
  <g font-size="17" fill="#1a1a1a">
    <circle cx="310" cy="215" r="17" fill="#fff" stroke="#333" stroke-width="2.5"/>
    <text x="310" y="221" text-anchor="middle" font-weight="bold">1</text>
    <circle cx="310" cy="270" r="17" fill="#fff" stroke="#333" stroke-width="2.5"/>
    <text x="310" y="276" text-anchor="middle" font-weight="bold">2</text>
    <circle cx="310" cy="325" r="17" fill="#fff" stroke="#333" stroke-width="2.5"/>
    <text x="310" y="331" text-anchor="middle" font-weight="bold">8</text>
  </g>
  <g font-size="15" fill="#1a1a1a">
    <text x="70" y="210">RJ45 pin 1</text><text x="70" y="229" fill="#555">white/orange</text>
    <text x="70" y="265">RJ45 pin 2</text><text x="70" y="284" fill="#555">blue</text>
    <text x="70" y="320">RJ45 pin 8</text><text x="70" y="339" fill="#555">white/green</text>
  </g>

  <!-- right terminals -->
  <g font-size="17" fill="#1a1a1a">
    <circle cx="690" cy="215" r="17" fill="#fff" stroke="#333" stroke-width="2.5"/>
    <text x="690" y="221" text-anchor="middle" font-weight="bold">2</text>
    <circle cx="690" cy="270" r="17" fill="#fff" stroke="#333" stroke-width="2.5"/>
    <text x="690" y="276" text-anchor="middle" font-weight="bold">3</text>
    <circle cx="690" cy="325" r="17" fill="#fff" stroke="#333" stroke-width="2.5"/>
    <text x="690" y="331" text-anchor="middle" font-weight="bold">5</text>
  </g>
  <g font-size="15" fill="#1a1a1a" text-anchor="end">
    <text x="930" y="210">DB9 pin 2</text><text x="930" y="229" fill="#555">computer receives (RXD)</text>
    <text x="930" y="265">DB9 pin 3</text><text x="930" y="284" fill="#555">computer sends (TXD)</text>
    <text x="930" y="320">DB9 pin 5</text><text x="930" y="339" fill="#555">ground (GND)</text>
  </g>

  <!-- signal labels on wires -->
  <g font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">
    <text x="500" y="200">inverter TXD  &#8594;  computer RXD</text>
    <text x="500" y="255">inverter RXD  &#8592;  computer TXD</text>
    <text x="500" y="310">GND</text>
  </g>

  <!-- notes -->
  <g font-size="16" fill="#222">
    <text x="50" y="410">&#8226; Serial settings: 2400 baud, 8 data bits, no parity, 1 stop bit, no flow control.</text>
    <text x="50" y="436">&#8226; Only RJ45 pins 1, 2 and 8 are used. The other pins stay unconnected.</text>
    <text x="50" y="462">&#8226; A USB-RS232 adapter normally has a male DB9, so the cable end is a female DB9.</text>
    <text x="50" y="488">&#8226; Check the wire colours against the pins with a meter: cable colours are not always the same.</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
